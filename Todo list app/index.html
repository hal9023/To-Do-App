<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'"
        />
        <script src="src/todo.js"></script>
        <title>Electron Test Renderer!</title>
    </head>
    <body>
        <div class="header"><h1>To-Do List</h1></div>
        <div class="bodyCheckBox">

            <label for="importTDL">Import To-Do List:</label>
            <input type="button" id="importTDL" value="Import To-Do List"/><br>
            
            <label for="exportTDL">Export To-Do List:</label>
            <input type="button" id="exportTDL" value="Export To-Do List"/><br>

            <label for="clearTDL">Clear To-Do List:</label>
            <input type="button" id="clearTDL" value="Clear To-Do List"/><br>

            <label for="taskName">Task Title:</label>
            <input type="text" id="taskName" name="Task Name Input Box" placeholder="Press Enter to Create Task"/>
            <!-- Deprecated create new btton, would rather use enter key-->
            <!-- <input type="button" id="newBtn" value="Create New"/> -->
        </div>
    </body>
</html>
